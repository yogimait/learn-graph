[package]
name = "my-tracker"
version = "0.1.0"
description = "LearnGraph - personal learning progress tracker"
authors = ["you"]
edition = "2021"

[lib]
name = "my_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required for production builds: embeds frontendDist instead of devUrl.
# `tauri build` enables it automatically; plain `cargo build --release` does not.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
